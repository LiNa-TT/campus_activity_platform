<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>报名统计</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
<h1>报名统计 - <span th:text="${activity.title}"></span></h1>
<div th:if="${message}" class="alert alert-ok" th:text="${message}"></div>
<div class="stat-cards">
<div class="stat-card"><div class="num" th:text="${total}"></div><div>报名总数</div></div>
<div class="stat-card"><div class="num" th:text="${signedIn}"></div><div>已签到</div></div>
<div class="stat-card"><div class="num" th:text="${absent}"></div><div>缺席</div></div>
</div>
<a class="btn" href="/admin">返回后台</a>

<h2>报名人员与签到管理</h2>
<table th:if="${!registrations.isEmpty()}">
<tr><th>编号</th><th>姓名</th><th>报名时间</th><th>签到状态</th><th>反馈</th><th>签到操作</th></tr>
<tr th:each="r:${registrations}">
<td th:text="${r.studentNo}"></td><td th:text="${r.studentName}"></td>
<td th:text="${r.registerTime}"></td><td th:text="${r.attendance}"></td>
<td th:text="${r.feedbackRating!=null?'★'+r.feedbackRating+' '+r.feedbackComment:'-'}"></td>
<td>
<form method="post" action="/admin/activity/signin" style="display:inline">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input type="hidden" name="registrationId" th:value="${r.id}">
<input type="hidden" name="activityId" th:value="${activity.id}">
<select name="attendance">
<option value="已签到">已签到</option>
<option value="缺席">缺席</option>
<option value="未签到">未签到</option>
</select>
<button class="btn-sm">更新</button>
</form>
</td></tr></table>
<p class="empty" th:if="${registrations.isEmpty()}">暂无报名记录</p>
</main>
</body></html>
