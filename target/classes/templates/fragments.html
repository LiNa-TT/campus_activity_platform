<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!-- 共享页头：导航栏按登录状态与角色显示 -->
<header th:fragment="header">
    <div class="logo">校园活动聚合平台</div>
    <nav>
        <a href="/">首页</a>
        <a href="/activities">活动中心</a>
        <a href="/news">热点新闻</a>
        <a href="/consultations">活动资讯</a>
        <a sec:authorize="isAuthenticated()" href="/my-registrations">我的报名</a>
        <a sec:authorize="isAuthenticated()" href="/subscriptions">我的订阅</a>
        <a sec:authorize="isAuthenticated()" href="/messages">消息<span class="badge" th:if="${unreadCount!=null and unreadCount>0}" th:text="${unreadCount}"></span></a>
        <a sec:authorize="hasAnyRole('ADMIN','EVENT_ADMIN','CLUB_LEADER','UNION_ADMIN')" href="/admin">后台管理</a>
        <span sec:authorize="isAuthenticated()" class="user-info">
            <span th:text="${currentUser?.name}"></span>
            <span class="role-badge" th:text="${currentUser?.role}"></span>
            <form method="post" action="/logout" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn-sm btn-gray">登出</button>
            </form>
        </span>
        <a sec:authorize="isAnonymous()" href="/login">登录</a>
    </nav>
</header>
</body>
</html>
