<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>登录</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="center" style="margin-top:60px">
    <div class="panel" style="max-width:420px;margin:0 auto;text-align:left">
        <h1 style="text-align:center">用户登录</h1>
        <div th:if="${param.error}" class="alert alert-err">用户名或密码错误</div>
        <div th:if="${param.logout}" class="alert alert-ok">已安全登出</div>
        <form method="post" action="/login">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <p><input name="username" required placeholder="用户名" style="width:100%"></p>
            <p><input name="password" type="password" required placeholder="密码" style="width:100%"></p>
            <p style="text-align:center"><button style="width:100%">登录</button></p>
        </form>
        <div class="alert" style="background:#f0f4ff;color:#444">
            <b>测试账号（密码均为 123456）：</b><br>
            admin / student / teacher / clubleader / eventadmin / unionadmin
        </div>
    </div>
</main>
</body></html>
