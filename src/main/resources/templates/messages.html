<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"><title>我的消息</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main><h1>我的消息
<form method="post" action="/messages/read-all" style="float:right;display:inline">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button class="btn-sm btn-gray">全部已读</button>
</form></h1>
<p class="empty" th:if="${messages.isEmpty()}">暂无消息</p>
<div class="msg-item" th:each="m:${messages}" th:classappend="${!m.isRead}?'unread':''">
<div>
<span class="cat-tag" th:text="${m.category}"></span>
<span th:text="${m.content}"></span>
<small style="color:#999;margin-left:8px" th:text="${m.createdTime}"></small>
<a th:if="${m.activity!=null}" class="btn-sm btn-gray" th:href="@{'/activities/'+${m.activity.id}}" style="margin-left:8px">查看活动</a>
</div>
<form method="post" th:if="${!m.isRead}" th:action="@{'/messages/'+${m.id}+'/read'}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<button class="btn-sm">标记已读</button>
</form>
</div>
</main>
</body></html>
